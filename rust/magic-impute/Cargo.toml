[package]
name = "magic-impute"
version = "0.1.0"
edition = "2021"
description = "Fast parallel MAGIC imputation (sparse diffusion operator × dense expression)"
license = "GPL-2.0-or-later"

[dependencies]
ndarray = "0.16"
ndarray-npy = "0.9"
rayon = "1.10"

[[bin]]
name = "magic-impute-cli"
path = "src/bin/magic_impute_cli.rs"

[[bin]]
name = "compare_magic_timings"
path = "src/bin/compare_magic_timings.rs"

[[bin]]
name = "scale_rust"
path = "src/bin/scale_rust.rs"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "magic_bench"
harness = false
